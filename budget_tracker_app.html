                resetData: "Obnoviť predvolené dáta",
                resetConfirm: "Naozaj chcete obnoviť všetky transakcie na predvolené?",
                footerNote: "FinControl Portfolio Project • React.js & Tailwind CSS",
                modalTitle: "Nová transakcia",

                catSalary: "Mzda",

            }
        };

        // Category keys map for internal storage and translation
        const CATEGORY_KEYS = {
            income: ['catSalary', 'catFreelance', 'catInvestments', 'catGifts', 'catOtherInc'],
            expense: ['catFood', 'catHousing', 'catTransport', 'catEntertainment', 'catHealth', 'catShopping', 'catEducation', 'catOtherExp']
        };

        // Currency definitions & exchange rates relative to UAH (base currency in initial data)
        // 1 EUR = ~42 UAH, 1 USD = ~39 UAH, 1 UAH = 1 UAH
        const CURRENCIES = {
            UAH: { symbol: '₴', rate: 1, name: 'UAH (₴)' },
            EUR: { symbol: '€', rate: 1 / 42, name: 'EUR (€)' },
            USD: { symbol: '$', rate: 1 / 39, name: 'USD ($)' }
        };

        const INITIAL_TRANSACTIONS = [
            { id: '1', title: 'Monthly Salary', amount: 85000, type: 'income', categoryKey: 'catSalary', date: '2026-06-01' },
            { id: '2', title: 'Supermarket groceries', amount: 4500, type: 'expense', categoryKey: 'catFood', date: '2026-06-02' },
            { id: '3', title: 'Apartment rent', amount: 30000, type: 'expense', categoryKey: 'catHousing', date: '2026-06-03' },
            { id: '4', title: 'Freelance project', amount: 15000, type: 'income', categoryKey: 'catFreelance', date: '2026-06-05' },
            { id: '5', title: 'Taxi ride', amount: 650, type: 'expense', categoryKey: 'catTransport', date: '2026-06-06' },
            { id: '6', title: 'Cinema with friends', amount: 1200, type: 'expense', categoryKey: 'catEntertainment', date: '2026-06-07' }
        ];

        const CATEGORY_COLORS = {
            'catSalary': 'bg-emerald-500 text-white',
            'catFreelance': 'bg-teal-500 text-white',
            'catInvestments': 'bg-cyan-500 text-white',
            'catGifts': 'bg-sky-500 text-white',
            'catOtherInc': 'bg-slate-500 text-white',
            'catFood': 'bg-amber-500 text-white',
            'catHousing': 'bg-rose-500 text-white',
            'catTransport': 'bg-indigo-500 text-white',
            'catEntertainment': 'bg-purple-500 text-white',
            'catHealth': 'bg-pink-500 text-white',
            'catShopping': 'bg-orange-500 text-white',
            'catEducation': 'bg-blue-500 text-white',
            'catOtherExp': 'bg-slate-500 text-white'
        };

        function App() {
            // Language state (en, ru, sk)
            const [lang, setLang] = useState(() => localStorage.getItem('fin_lang') || 'en');
            const t = TRANSLATIONS[lang];

            // Currency state (UAH, EUR, USD)
            const [currency, setCurrency] = useState(() => localStorage.getItem('fin_currency') || 'EUR');

            // Dark mode state
            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem('theme') === 'dark' || 
                       (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            });

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [darkMode]);

            useEffect(() => {
                localStorage.setItem('fin_lang', lang);
            }, [lang]);

            useEffect(() => {
                localStorage.setItem('fin_currency', currency);
            }, [currency]);

            // Transactions state
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('fin_transactions_v2');
                return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
            });

            useEffect(() => {
                localStorage.setItem('fin_transactions_v2', JSON.stringify(transactions));
            }, [transactions]);

            // Filters and Modal states
            const [filterType, setFilterType] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);

            // Re-initialize Lucide icons on render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Convert raw amount (stored in base UAH) to target currency
            const convertAmount = (val) => {
                const num = Number(val);
                const rate = CURRENCIES[currency].rate;
                return num * rate;
            };

            // Calculate totals
            const { totalIncome, totalExpense, balance } = useMemo(() => {
                let inc = 0;
                let exp = 0;
                transactions.forEach(t => {
                    const amt = convertAmount(t.amount);
                    if (t.type === 'income') inc += amt;
                    else exp += amt;
                });
                return {
                    totalIncome: inc,
                    totalExpense: exp,
                    balance: inc - exp
                };
            }, [transactions, currency]);

            // Filtered transactions list
            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    const matchesType = filterType === 'all' || t.type === filterType;
                    const catName = t.categoryKey ? t.categoryKey : '';
                    const localizedCat = t.categoryKey && t[t.categoryKey] ? t[t.categoryKey].toLowerCase() : '';
                    const matchesSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                          localizedCat.includes(searchQuery.toLowerCase());
                    return matchesType && matchesSearch;
                }).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [transactions, filterType, searchQuery, lang]);

            const handleAddTransaction = (newTx) => {
                setTransactions(prev => [
                    { id: Date.now().toString(), ...newTx },
                    ...prev
                ]);
                setIsModalOpen(false);
            };

            const handleDeleteTransaction = (id) => {
                setTransactions(prev => prev.filter(t => t.id !== id));
            };

            const handleResetData = () => {
                if (confirm(t.resetConfirm)) {
                    setTransactions(INITIAL_TRANSACTIONS);
                }
            };

            return (
                <div className="min-h-full flex flex-col">
                    {/* Header */}
                    <header className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-brand-600 text-white p-2 rounded-xl shadow-md flex items-center justify-center">
                                    <i data-lucide="wallet" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-slate-900 dark:text-white leading-tight">{t.appName}</h1>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">{t.tagline}</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2 sm:space-x-3">
                                {/* Currency Selector */}
                                <select 
                                    value={currency} 
                                    onChange={(e) => setCurrency(e.target.value)}
                                    className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-semibold px-2.5 py-2 rounded-xl focus:outline-none focus:border-brand-500 text-slate-700 dark:text-slate-200"
                                >
                                    <option value="EUR">EUR (€)</option>
                                    <option value="USD">USD ($)</option>
                                    <option value="UAH">UAH (₴)</option>
                                </select>

                                {/* Language Selector */}
                                <select 
                                    value={lang} 
                                    onChange={(e) => setLang(e.target.value)}
                                    className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs font-semibold px-2.5 py-2 rounded-xl focus:outline-none focus:border-brand-500 text-slate-700 dark:text-slate-200"
                                >
                                    <option value="en">English</option>
                                    <option value="ru">Русский</option>
                                    <option value="sk">Slovenčina</option>
                                </select>

                                {/* Theme Switcher */}
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none"
                                    title="Toggle theme"
                                >
                                    {darkMode ? <i data-lucide="sun" className="w-4 h-4"></i> : <i data-lucide="moon" className="w-4 h-4"></i>}
                                </button>

                                {/* Add Transaction Button */}
                                <button 
                                    onClick={() => setIsModalOpen(true)}
                                    className="bg-brand-600 hover:bg-brand-700 text-white font-medium px-3.5 py-2 rounded-xl shadow-lg shadow-brand-500/20 flex items-center space-x-1.5 text-xs sm:text-sm transition-all"
                                >
                                    <i data-lucide="plus" className="w-4 h-4"></i>
                                    <span className="hidden sm:inline">{t.newOperation}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                        
                        {/* Metrics Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {/* Total Balance */}
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden">
                                <div className="absolute right-4 top-4 bg-brand-50 dark:bg-slate-700 p-3 rounded-2xl text-brand-600 dark:text-brand-400">
                                    <i data-lucide="landmark" className="w-6 h-6"></i>
                                </div>
                                <p className="text-sm font-medium text-slate-500 dark:text-slate-400">{t.totalBalance}</p>
                                <h3 className={`text-3xl font-bold mt-2 ${balance >= 0 ? 'text-slate-900 dark:text-white' : 'text-rose-600'}`}>
                                    {balance.toLocaleString('ru-RU', { maximumFractionDigits: 2 })} {CURRENCIES[currency].symbol}
                                </h3>
                                <div className="mt-4 flex items-center text-xs text-slate-500 dark:text-slate-400 space-x-1">
                                    <span className="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                                    <span>{t.activeSavings}</span>
                                </div>
                            </div>

                            {/* Total Income */}
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden">
                                <div className="absolute right-4 top-4 bg-emerald-50 dark:bg-emerald-950/40 p-3 rounded-2xl text-emerald-600 dark:text-emerald-400">
                                    <i data-lucide="trending-up" className="w-6 h-6"></i>
                                </div>
                                <p className="text-sm font-medium text-slate-500 dark:text-slate-400">{t.totalIncome}</p>
                                <h3 className="text-3xl font-bold mt-2 text-emerald-600 dark:text-emerald-400">
                                    +{totalIncome.toLocaleString('ru-RU', { maximumFractionDigits: 2 })} {CURRENCIES[currency].symbol}
                                </h3>
                                <div className="mt-4 flex items-center text-xs text-slate-500 dark:text-slate-400 space-x-1">
                                    <span>{t.allTimeEarnings}</span>
                                </div>
                            </div>

                            {/* Total Expense */}
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden">
                                <div className="absolute right-4 top-4 bg-rose-50 dark:bg-rose-950/40 p-3 rounded-2xl text-rose-600 dark:text-rose-400">
                                    <i data-lucide="trending-down" className="w-6 h-6"></i>
                                </div>
                                <p className="text-sm font-medium text-slate-500 dark:text-slate-400">{t.totalExpense}</p>
                                <h3 className="text-3xl font-bold mt-2 text-rose-600 dark:text-rose-400">
                                    -{totalExpense.toLocaleString('ru-RU', { maximumFractionDigits: 2 })} {CURRENCIES[currency].symbol}
                                </h3>
                                <div className="mt-4 flex items-center text-xs text-slate-500 dark:text-slate-400 space-x-1">
                                    <span>{t.spentFunds}</span>
                                </div>
                            </div>
                        </div>

                        {/* Charts Section */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-2 bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                                <div className="flex items-center justify-between mb-4">
                                    <h4 className="font-semibold text-slate-900 dark:text-white flex items-center space-x-2">
                                        <i data-lucide="bar-chart-3" className="w-5 h-5 text-brand-500"></i>
                                        <span>{t.incomeExpenseDynamics}</span>
                                    </h4>
                                    <span className="text-xs text-slate-400 bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg">{t.byOperations}</span>
                                </div>
                                <div className="relative h-72 w-full">
                                    <IncomeExpenseChart transactions={transactions} currency={currency} darkMode={darkMode} t={t} />
                                </div>
                            </div>

                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                                <div className="flex items-center justify-between mb-4">
                                    <h4 className="font-semibold text-slate-900 dark:text-white flex items-center space-x-2">
                                        <i data-lucide="pie-chart" className="w-5 h-5 text-brand-500"></i>
                                        <span>{t.expensesByCategory}</span>
                                    </h4>
                                </div>
                                <div className="relative h-72 w-full flex items-center justify-center">
                                    <ExpensePieChart transactions={transactions} currency={currency} darkMode={darkMode} t={t} />
                                </div>
                            </div>
                        </div>

                        {/* Transactions Table Section */}
                        <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                            <div className="p-6 border-b border-slate-200 dark:border-slate-700 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div>
                                    <h3 className="text-lg font-bold text-slate-900 dark:text-white">{t.transactionHistory}</h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">{t.allTransactions}</p>
                                </div>

                                    <div className="relative">
                                        <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                            <i data-lucide="search" className="w-4 h-4"></i>
                                        </span>
                                        <input 
                                            type="text" 
                                            placeholder={t.searchPlaceholder} 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}

                                        />

                                    <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-medium">
                                        <button 
                                            onClick={() => setFilterType('all')}
                                            className={`px-3 py-1.5 rounded-lg transition-all ${filterType === 'all' ? 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-sm' : 'text-slate-500'}`}
                                        >
                                            {t.all}
                                        </button>
                                        <button 
                                            onClick={() => setFilterType('income')}
                                            className={`px-3 py-1.5 rounded-lg transition-all ${filterType === 'income' ? 'bg-white dark:bg-slate-800 text-emerald-600 shadow-sm' : 'text-slate-500'}`}
                                        >
                                            {t.incomes}
                                        </button>
                                        <button 
                                            onClick={() => setFilterType('expense')}
                                            className={`px-3 py-1.5 rounded-lg transition-all ${filterType === 'expense' ? 'bg-white dark:bg-slate-800 text-rose-600 shadow-sm' : 'text-slate-500'}`}
                                        >
                                            {t.expenses}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Table */}
                            <div className="overflow-x-auto">
                                {filteredTransactions.length === 0 ? (
                                    <div className="py-16 text-center">
                                        <div className="bg-slate-100 dark:bg-slate-900 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-slate-400 mb-4">
                                            <i data-lucide="receipt" className="w-8 h-8"></i>
                                        </div>
                                        <p className="text-slate-600 dark:text-slate-400 font-medium">{t.noTransactions}</p>
                                        <p className="text-xs text-slate-400 mt-1">{t.noTransactionsSub}</p>
                                    </div>
                                ) : (
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-50/50 dark:bg-slate-900/50">
                                                <th className="py-3 px-6">{t.nameHeader}</th>
                                                <th className="py-3 px-6">{t.categoryHeader}</th>
                                                <th className="py-3 px-6">{t.dateHeader}</th>
                                                <th className="py-3 px-6 text-right">{t.amountHeader}</th>
                                                <th className="py-3 px-6 text-center">{t.actionsHeader}</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 dark:divide-slate-700 text-sm">
                                            {filteredTransactions.map(tx => {
                                                const converted = convertAmount(tx.amount);
                                                const catKey = tx.categoryKey || 'catOtherExp';
                                                const catLabel = t[catKey] || catKey;
                                                return (
                                                    <tr key={tx.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-700/30 transition-colors">
                                                        <td className="py-4 px-6 font-medium text-slate-900 dark:text-white flex items-center space-x-3">
                                                            <div className={`p-2 rounded-xl flex items-center justify-center ${tx.type === 'income' ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600' : 'bg-rose-100 dark:bg-rose-950/60 text-rose-600'}`}>
                                                                <i data-lucide={tx.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'} className="w-4 h-4"></i>
                                                            </div>
                                                            <span>{tx.title}</span>
                                                        </td>
                                                        <td className="py-4 px-6">
                                                            <span className={`inline-block px-2.5 py-1 rounded-lg text-xs font-medium ${CATEGORY_COLORS[catKey] || 'bg-slate-500 text-white'}`}>
                                                                {catLabel}
                                                            </span>
                                                        </td>
                                                        <td className="py-4 px-6 text-slate-500 dark:text-slate-400 text-xs">
                                                            {new Date(tx.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}
                                                        </td>
                                                        <td className={`py-4 px-6 text-right font-bold ${tx.type === 'income' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-900 dark:text-white'}`}>
                                                            {tx.type === 'income' ? '+' : '-'}{converted.toLocaleString('ru-RU', { maximumFractionDigits: 2 })} {CURRENCIES[currency].symbol}
                                                        </td>
                                                        <td className="py-4 px-6 text-center">
                                                            <button 
                                                                onClick={() => handleDeleteTransaction(tx.id)}
                                                                className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl transition-all"
                                                                title="Delete"
                                                            >
                                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>

                        {/* Footer / Reset */}
                        <div className="flex justify-between items-center pt-4 pb-8">
                            <button 
                                onClick={handleResetData}
                                className="text-xs text-slate-400 hover:text-rose-600 flex items-center space-x-1 transition-colors"
                            >
                                <i data-lucide="rotate-ccw" className="w-3.5 h-3.5"></i>
                                <span>{t.resetData}</span>
                            </button>
                            <p className="text-xs text-slate-400">{t.footerNote}</p>
                        </div>
                    </main>

                    {/* Modal */}
                    {isModalOpen && (
                        <AddTransactionModal 
                            isOpen={isModalOpen} 
                            onClose={() => setIsModalOpen(false)} 
                            onAdd={handleAddTransaction} 
                            t={t}
                            currency={currency}
                        />
                    )}
                </div>
            );
        }

        function AddTransactionModal({ isOpen, onClose, onAdd, t, currency }) {
            const [title, setTitle] = useState('');
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('expense');
            const [categoryKey, setCategoryKey] = useState(CATEGORY_KEYS['expense'][0]);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [error, setError] = useState('');

            const handleTypeChange = (newType) => {
                setType(newType);
                setCategoryKey(CATEGORY_KEYS[newType][0]);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) {
                    setError(t.errTitle);
                    return;
                }
                if (!amount || isNaN(amount) || Number(amount) <= 0) {
                    setError(t.errAmount);
                    return;
                }

                // Amount is stored in base UAH. If user typed in EUR or USD, convert back to UAH rate so storage remains uniform
                const rateToUAH = 1 / CURRENCIES[currency].rate;
                const baseAmountUAH = Number(amount) * rateToUAH;

                onAdd({
                    title: title.trim(),
                    amount: baseAmountUAH,
                    type,
                    categoryKey,
                    date
                });
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-700 shadow-2xl space-y-6">
                        <div className="flex items-center justify-between">
                            <h3 className="text-lg font-bold text-slate-900 dark:text-white flex items-center space-x-2">
                                <i data-lucide="plus-circle" className="w-5 h-5 text-brand-500"></i>
                                <span>{t.modalTitle}</span>
                            </h3>
                            <button 
                                onClick={onClose}
                                className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-xl"
                            >
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        {error && (
                            <div className="bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400 text-xs p-3 rounded-xl flex items-center space-x-2">
                                <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                                <span>{error}</span>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl">
                                <button
                                    type="button"
                                    onClick={() => handleTypeChange('expense')}
                                    className={`py-2 rounded-xl text-xs font-semibold transition-all ${type === 'expense' ? 'bg-rose-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}
                                >
                                    {t.expenseType}
                                </button>
                                <button
                                    type="button"
                                    onClick={() => handleTypeChange('income')}
                                    className={`py-2 rounded-xl text-xs font-semibold transition-all ${type === 'income' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}
                                >
                                    {t.incomeType}
                                </button>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">{t.titleLabel}</label>
                                <input 
                                    type="text" 
                                    placeholder={t.titlePlaceholder} 
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-brand-500"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">{t.amountLabel} ({CURRENCIES[currency].symbol})</label>
                                <input 
                                    type="number" 
                                    placeholder="0" 
                                    value={amount}
                                    onChange={(e) => setAmount(e.target.value)}
                                    className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-brand-500"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">{t.categoryLabel}</label>
                                <select 
                                    value={categoryKey}
                                    onChange={(e) => setCategoryKey(e.target.value)}
                                    className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-brand-500"
                                >
                                    {CATEGORY_KEYS[type].map(ck => (
                                        <option key={ck} value={ck}>{t[ck] || ck}</option>
                                    ))}
                                </select>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">{t.dateLabel}</label>
                                <input 
                                    type="date" 
                                    value={date}
                                    onChange={(e) => setDate(e.target.value)}
                                    className="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-brand-500"
                                />
                            </div>

                            <div className="pt-2 flex space-x-3">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="w-1/2 py-3 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 font-medium rounded-xl text-sm transition-all"
                                >
                                    {t.cancelBtn}
                                </button>
                                <button
                                    type="submit"
                                    className="w-1/2 py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl text-sm shadow-lg shadow-brand-500/20 transition-all"
                                >
                                    {t.addBtn}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function IncomeExpenseChart({ transactions, currency, darkMode, t }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;

                const rate = CURRENCIES[currency].rate;
                const dateMap = {};
                const sorted = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
                
                sorted.forEach(tx => {
                    const d = tx.date;
                    if (!dateMap[d]) {
                        dateMap[d] = { income: 0, expense: 0 };
                    }
                    const converted = Number(tx.amount) * rate;
                    if (tx.type === 'income') dateMap[d].income += converted;
                    else dateMap[d].expense += converted;
                });

                const labels = Object.keys(dateMap).map(d => {
                    return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
                });
                const incomeData = Object.values(dateMap).map(item => item.income);
                const expenseData = Object.values(dateMap).map(item => item.expense);

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels.length ? labels : ['No data'],
                        datasets: [
                            {
                                label: t.incomes,
                                data: labels.length ? incomeData : [0],
                                backgroundColor: '#10b981',
                                borderRadius: 8,
                            },
                            {
                                label: t.expenses,
                                data: labels.length ? expenseData : [0],
                                backgroundColor: '#f43f5e',
                                borderRadius: 8,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    color: darkMode ? '#cbd5e1' : '#475569',
                                    font: { family: 'Inter', size: 12 }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: darkMode ? '#94a3b8' : '#64748b' }
                            },
                            y: {
                                grid: { color: darkMode ? '#334155' : '#f1f5f9' },
                                ticks: { color: darkMode ? '#94a3b8' : '#64748b' }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [transactions, currency, darkMode, t]);

            return <canvas ref={chartRef}></canvas>;
        }

        function ExpensePieChart({ transactions, currency, darkMode, t }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;

                const rate = CURRENCIES[currency].rate;
                const categoryMap = {};
                
                transactions.filter(tx => tx.type === 'expense').forEach(tx => {
                    const ck = tx.categoryKey || 'catOtherExp';
                    const localizedName = t[ck] || ck;
                    categoryMap[localizedName] = (categoryMap[localizedName] || 0) + (Number(tx.amount) * rate);
                });

                const labels = Object.keys(categoryMap);
                const data = Object.values(categoryMap);

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels.length ? labels : ['No expenses'],
                        datasets: [{
                            data: labels.length ? data : [1],
                            backgroundColor: labels.length ? [
                                '#f43f5e', '#8b5cf6', '#3b82f6', '#06b6d4', 
                                '#10b981', '#f59e0b', '#ec4899', '#64748b'
                            ] : ['#cbd5e1'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    boxWidth: 12,
                                    color: darkMode ? '#cbd5e1' : '#475569',
                                    font: { family: 'Inter', size: 11 }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [transactions, currency, darkMode, t]);

            return <canvas ref={chartRef}></canvas>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
